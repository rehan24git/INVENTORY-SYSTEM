<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Billing</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-primary">
    <div class="container-fluid">

        <a class="navbar-brand fw-bold">
            <i class="bi bi-receipt"></i>
            Billing System
        </a>

        <div>
            <a href="dashboard.html" class="btn btn-light">Dashboard</a>

            <button class="btn btn-danger" onclick="logout()">
                Logout
            </button>
        </div>

    </div>
</nav>

<div class="container mt-4">

<div id="noPrint">

<h2 class="mb-4">Generate Bill</h2>

<!-- Customer Details -->

<div class="row mb-3">

<div class="col-md-4">
<input
type="text"
id="customerName"
class="form-control"
placeholder="Customer Name">
</div>

<div class="col-md-4">
<input
type="text"
id="customerPhone"
class="form-control"
placeholder="Mobile Number">
</div>

<div class="col-md-4">
<select
id="paymentMethod"
class="form-select">

<option>Cash</option>
<option>UPI</option>
<option>Card</option>

</select>
</div>

</div>

<!-- Product -->

<div class="row">

<div class="col-md-5">

<select
id="billProduct"
class="form-select">

</select>

</div>

<div class="col-md-3">

<input
type="number"
id="billQty"
class="form-control"
placeholder="Quantity">

</div>

<div class="col-md-2">

<button
class="btn btn-success w-100"
onclick="generateBill()">

Add Bill

</button>

</div>

<div class="col-md-2">

<button
class="btn btn-danger w-100"
onclick="clearBill()">

Clear

</button>

</div>

</div>

<hr>

</div>

<div id="printArea">

<div class="text-center mb-4">

   <h2 id="shopName">CSCORNER COMPUTER STORE</h2>

<p>
Owner: <span id="ownerDisplay"></span><br>
Address: <span id="addressDisplay"></span><br>
Phone: <span id="phoneDisplay"></span>
</p>

    <hr>

</div>

<h3>Invoice</h3>

<table class="table table-bordered table-hover">

<thead class="table-dark">

<tr>

<th>Product</th>
<th>Qty</th>
<th>Price</th>
<th>Total</th>

</tr>

</thead>

<tbody id="billTable">

</tbody>

</table>

<p><strong>Invoice No:</strong> <span id="invoiceNo"></span></p>
<p><strong>Date:</strong> <span id="invoiceDate"></span></p>
<p><strong>Subtotal:</strong> ₹ <span id="subTotal">0</span></p>
<p><strong>GST (18%):</strong> ₹ <span id="gstAmount">0</span></p>

<div class="mb-2">
    <label class="form-label">Discount (%)</label>
    <input type="number" id="discount" class="form-control" value="0">
</div>

<div class="text-end">

<h3>

Grand Total :
₹ <span id="grandTotal">0</span>

</h3>

<button class="btn btn-primary" onclick="window.print()">
Print Invoice
</button>

<button class="btn btn-success ms-2" onclick="downloadPDF()">
Download PDF
</button>
</div>
</div>

</div>

<script src="script.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</body>
</html>
