<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar navbar-dark bg-primary">
    <div class="container-fluid">

        <a class="navbar-brand">
            📦 Product Management
        </a>

        <div>
            <a href="dashboard.html" class="btn btn-light me-2">
                Dashboard
            </a>

            <button class="btn btn-danger" onclick="logout()">
                Logout
            </button>
        </div>

    </div>
</nav>

<div class="container mt-4">

<h2>Add Product</h2>

<div class="row">

<div class="col-md-4">
<input type="text" id="productName" class="form-control" placeholder="Product Name">
</div>

<div class="col-md-2">
<input type="number" id="productPrice" class="form-control" placeholder="Price">
</div>

<div class="col-md-2">
<input type="number" id="productStock" class="form-control" placeholder="Stock">
</div>

<div class="col-md-2">
<button class="btn btn-primary w-100" onclick="addProduct()">
Add Product
</button>
</div>

</div>

<hr>

<input
type="text"
id="search"
class="form-control mb-3"
placeholder="Search Product..."
onkeyup="searchProduct()">

<table class="table table-bordered">

<thead class="table-dark">

<tr>

<th>ID</th>
<th>Name</th>
<th>Price</th>
<th>Stock</th>
<th>Action</th>

</tr>

</thead>

<tbody id="productTable">

</tbody>

</table>

</div>
<button onclick="alert('Working')">Test</button>

<script src="script.js"></script>

</body>
</html>
