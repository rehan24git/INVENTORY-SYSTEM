<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales History</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand">📜 Sales History</a>

        <a href="dashboard.html" class="btn btn-light">
            Dashboard
        </a>
    </div>
</nav>

<div class="container mt-4">
<div class="row mb-3">

    <div class="col-md-3">
        <label>From Date</label>
        <input type="date" id="fromDate" class="form-control">
    </div>

    <div class="col-md-3">
        <label>To Date</label>
        <input type="date" id="toDate" class="form-control">
    </div>

    <div class="col-md-2 d-flex align-items-end">
        <button class="btn btn-primary w-100" onclick="filterSales()">
            Search
        </button>
    </div>

    <div class="col-md-2 d-flex align-items-end">
        <button class="btn btn-secondary w-100" onclick="loadSales()">
            Reset
        </button>
    </div>

</div>
<h2>Sales History</h2>

<div class="card shadow p-3 mb-4">

    <h4>Monthly Sales</h4>
<button class="btn btn-success mb-3" onclick="exportSalesExcel()">
    📥 Export Sales to Excel
</button>
    <table class="table table-bordered">

        <thead class="table-dark">
            <tr>
                <th>Month</th>
                <th>Total Bills</th>
                <th>Total Revenue</th>
            </tr>
        </thead>

        <tbody id="monthlySalesTable">

        </tbody>

    </table>

</div>
<table class="table table-bordered table-hover">

<thead class="table-dark">

<tr>
<th>#</th>
<th>Product</th>
<th>Qty</th>
<th>Price</th>
<th>Total</th>
</tr>

</thead>

<tbody id="salesTable">

</tbody>

</table>
<div class="text-end mt-3">
    <h4>Total Revenue : ₹ <span id="revenue">0</span></h4>
</div>
</div>

<script src="script.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</body>
</html>
